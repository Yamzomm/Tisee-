<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tisee 盐化岩石搜索框</title>
<style>
body{margin:0;background:#e9dfd3;font-family:Arial,sans-serif;color:#392f28}.page{max-width:1000px;margin:auto;padding:60px 24px}.shell{position:relative}.bar{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;min-height:78px;padding:10px 10px 10px 22px;border:1px solid rgba(96,72,50,.22);border-radius:26px 34px 24px 40px/20px 28px 22px 32px;background:radial-gradient(ellipse at 14% 35%,rgba(255,253,247,.7),transparent 17%),radial-gradient(ellipse at 70% 28%,rgba(255,252,246,.4),transparent 12%),linear-gradient(135deg,#faf3e7,#f1e6d7 45%,#e7dac8);box-shadow:0 14px 32px rgba(61,44,32,.10)}
.bar:before{content:"";position:absolute;inset:0;opacity:.22;pointer-events:none;background-image:radial-gradient(circle,rgba(79,58,39,.35) 0 .6px,transparent 1px),radial-gradient(circle,rgba(255,243,217,.4) 0 .5px,transparent .9px);background-size:17px 19px,23px 21px}
.icon{position:relative;z-index:2;width:56px;height:56px;display:flex;align-items:center;justify-content:center;color:#f2e0bf;font-size:22px;border-radius:20px 25px 17px 24px/18px 24px 16px 21px;background:linear-gradient(145deg,#3d332c,#514239 58%,#3a312c)}
.field{position:relative;z-index:2;flex:1;height:56px;overflow:hidden}.vertical{position:absolute;left:16px;top:0;height:56px;overflow:hidden;opacity:.6;transition:.18s}.track{display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.22,.61,.36,1)}.item{height:56px;display:flex;align-items:center;font-size:22px;font-weight:600;color:#7b7168}.shell.active .vertical{opacity:0;visibility:hidden}.input{width:100%;height:100%;border:0;background:transparent;outline:0}
.go{position:relative;z-index:2;min-width:126px;height:56px;border:0;border-radius:18px 26px 16px 28px/16px 24px 15px 22px;background:linear-gradient(145deg,#c89252,#ae773d 55%,#996635);color:#fff6e7;font-weight:700}
.panel{position:absolute;left:0;right:0;top:92px;z-index:20;background:linear-gradient(180deg,#fbf6ee,#f3eadc);border:1px solid rgba(91,70,52,.12);border-radius:20px 34px 22px 30px/24px 22px 28px 20px;box-shadow:0 22px 48px rgba(54,40,29,.15);opacity:0;visibility:hidden;transform:translateY(-8px);transition:.2s;overflow:hidden}.panel.open{opacity:1;visibility:visible;transform:translateY(0)}
.head{padding:20px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:10px}.type{padding:13px;border:1px solid rgba(91,70,52,.14);background:#f2e8d8;border-radius:14px 20px 12px 18px}.type.active{background:#3e342e;color:#f3e4c5}.content{display:grid;grid-template-columns:300px 1fr}.regions{padding:12px 0;background:rgba(251,247,241,.68);border-right:1px solid rgba(91,70,52,.08)}.region{padding:14px 22px;opacity:.72}.region.active{opacity:1;background:linear-gradient(90deg,rgba(222,196,164,.86),rgba(233,217,196,.48))}.results{padding:22px}.card{padding:16px;border:1px solid rgba(91,70,52,.1);border-radius:16px 22px 14px 20px;background:#fffdf9}
</style></head><body>
<div class="page"><div class="shell" id="shell">
<div class="bar" id="bar"><div class="icon">⌕</div><div class="field"><div class="vertical"><div class="track" id="track">
<div class="item">拉萨</div><div class="item">日喀则</div><div class="item">昌都</div><div class="item">林芝</div><div class="item">山南</div><div class="item">那曲</div><div class="item">阿里</div><div class="item">拉萨</div>
</div></div><input class="input" readonly></div><button class="go" id="go">搜索</button></div>
<div class="panel" id="panel"><div class="head"><div>你想找什么？</div><div class="switch"><button class="type active">Local Host</button><button class="type">民宿</button></div></div>
<div class="content"><div class="regions"><div class="region active">拉萨 · Lhasa</div><div class="region">日喀则 · Shigatse</div><div class="region">昌都 · Chamdo</div><div class="region">林芝 · Nyingchi</div><div class="region">山南 · Shannan</div><div class="region">那曲 · Nagqu</div><div class="region">阿里 · Ngari</div></div><div class="results"><h3>拉萨的 Local Host</h3><div class="card">Lhamu · 八廓街 Local Market Experience</div></div></div></div>
</div></div>
<script>
const shell=document.getElementById('shell'),panel=document.getElementById('panel'),bar=document.getElementById('bar'),go=document.getElementById('go'),track=document.getElementById('track');let i=0,stopped=false;const timer=setInterval(()=>{if(stopped)return;i++;track.style.transform=`translateY(-${i*56}px)`;if(i===7)setTimeout(()=>{track.style.transition='none';i=0;track.style.transform='translateY(0)';requestAnimationFrame(()=>track.style.transition='transform .3s cubic-bezier(.22,.61,.36,1)')},320)},1000);function openSearch(){stopped=true;clearInterval(timer);shell.classList.add('active');panel.classList.add('open')}bar.onclick=openSearch;go.onclick=e=>{e.stopPropagation();openSearch()}
</script></body></html>
